[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "system-energy"
version = "0.1.0"
authors = [{name = "11-qlab"}]
description = "System-level energy comparison across post-CMOS technologies"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
keywords = ["energy", "computing", "post-CMOS", "system-level"]
dependencies = ["numpy", "matplotlib"]

[project.urls]
Homepage = "https://github.com/11-qlab/system-energy"

[project.scripts]
system-energy = "system_energy.cli:main"
